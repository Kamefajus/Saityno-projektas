openapi: '3.0.3'
info:
  title: API Title
  version: '1.0'
servers:
  - url: https://localhost:5133/api
paths:
  /movies:
    get:
      summary: Get a list of movies
      tags:
        - movie
      operationId: getAllMovies
      responses:
        "200":
          description: A list of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/movie"
              example:
                - id: 1
                  title: "OpenAPI Best Practices"
                  description: "Discussion about best practices when using OpenAPI"
                - id: 2
                  title: "API Versioning Strategies"
                  description: "A movie to discuss various API versioning techniques"
    post:
      description: "Create a movie"
      tags:
        - movie
      operationId: createMovie
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createMovie"
            example:
              - title: "OpenAPI Best Practices"
                description: "Discussion about best practices when using OpenAPI"
      responses:
        "201":
          $ref: "#/components/responses/singleMovie"
        "400":
          $ref: "#/components/responses/badRequest"
        "422":
          $ref: "#/components/responses/unprocessableEntity"

  /movies/{movieId}:
    parameters:
      - $ref: '#/components/parameters/movieId'
    get:
      summary: Get a movie by ID
      tags:
        - movie
      operationId: getMovie
      responses:
        "200":
          $ref: "#/components/responses/singleMovie"
        "404":
          $ref: "#/components/responses/notFound"
    put:
      summary: Update a movie by ID
      tags:
        - movie
      operationId: updateMovie
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateMovie"
            example:
              - description: "Discussion about best practices when using OpenAPI"
      responses:
        "200":
          $ref: "#/components/responses/singleMovie"
        "400":
          $ref: "#/components/responses/badRequest"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
    delete:
      summary: Delete a Movie by ID
      tags:
        - Movie
      operationId: deleteMovie
      responses:
        "404":
          $ref: "#/components/responses/notFound"
        "204":
          description: Movie deleted
  /movies/{movieId}/posts:
    parameters:
      - $ref: '#/components/parameters/movieId'
    get:
      summary: Get posts for a movie
      tags:
        - post
      operationId: getPosts
      responses:
        "200":
          description: List of posts
    post:
      description: 'Add a post'
      tags:
        - post
      operationId: createPost
      responses:
        '201':
          description: OK
  /movies/{movieId}/posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/movieId'
      - $ref: '#/components/parameters/postId'
    get:
      summary: Get a specific post for a movie
      tags:
        - post
      operationId: getPost
      responses:
        "200":
          description: A single post
    put:
      summary: Update a post for a movie
      tags:
        - post
      operationId: updatePost
      responses:
        "200":
          description: Updated post
    delete:
      summary: Delete a post for a movie
      tags:
        - post
      operationId: deletePost
      responses:
        "204":
          description: Post deleted
  /movies/{movieId}/posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/movieId'
      - $ref: '#/components/parameters/postId'
    get:
      summary: Get comments for a specific post
      tags:
        - comment
      operationId: getComments
      responses:
        "200":
          description: List of comments
    post:
      description: "Add a comment for a specific post"
      tags:
        - comment
      operationId: createComment
      responses:
        "201":
          description: OK
  /movies/{id}/posts/{postId}/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/movieId'
      - $ref: '#/components/parameters/postId'
      - $ref: '#/components/parameters/commentId'
    get:
      summary: Get a specific comment
      tags:
        - comment
      operationId: getComment
      responses:
        "200":
          description: A single comment
    put:
      summary: Update a comment
      tags:
        - comment
      operationId: updateComment
      responses:
        "200":
          description: Updated comment
    delete:
      summary: Delete a comment
      tags:
        - comment
      operationId: deleteComment
      responses:
        "204":
          description: Comment deleted
components:
  schemas:
    movie:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
    createMovie:
      type: object
      required:
        - title
        - description
      properties:
        title:
          minLength: 2
          maxLength: 100
          pattern: "^[a-zA-Z0-9_]+$"  # Only allows letters, numbers, and underscores
          type: string
        description:
          minLength: 3
          maxLength: 500
          pattern: "^[a-zA-Z0-9_]+$"  # Only allows letters, numbers, and underscores
          type: string
    updateMovie:
      type: object
      properties:
        description:
          type: string
    post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        body:
          type: string
    comment:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
    problemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code applicable to this problem.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence of the problem.
        errors:
          type: object
          description: A map of detailed errors for every property ([property => error])
  responses:
    singleMovie:
      description: A movie
      content:
        application/json:
          schema:
            type: object
            items:
              $ref: "#/components/schemas/movie"
          example:
            - id: 1
              title: "OpenAPI Best Practices"
              description: "Discussion about best practices when using OpenAPI"
    unprocessableEntity:
      description: Unprocessable entity response
      content:
        application/problem+json:
          schema:
            type: object
            items:
              $ref: "#/components/schemas/problemDetails"
          example:
            type: "https://tools.ietf.org/html/rfc4918#section-11.2"
            title: "Unprocessable Entity"
            status: 422
            errors:
              Name:
                - "'Name' must not be empty."
    badRequest:
      description: Bad request response
    notFound:
      description: Resource was not found
  parameters:
    movieId:
      name: movieId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: The unique identifier of the movie
    postId:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: The unique identifier of the post
    commentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: The unique identifier of the comment
  
tags:
  - name: movie
    description: Operations related to movies
  - name: post
    description: Operations related to posts
  - name: comment
    description: Operations related to comments

externalDocs:
  description: Find more info here
  url: https://example.com/docs
